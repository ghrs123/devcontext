spring:
  profiles:
    active: dev
  application:
    name: fitvision-backend

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitvision}
    username: ${DB_USERNAME:fitvision}
    password: ${DB_PASSWORD:fitvision}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.fitvision: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
