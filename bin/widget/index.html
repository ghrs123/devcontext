<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitVision Widget Local Integration</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: linear-gradient(120deg, #f8fbfe, #ffffff 45%, #f9fafc);
        color: #1b2430;
      }

      .page-wrap {
        max-width: 860px;
        margin: 0 auto;
      }

      .note {
        border: 1px solid #c9d9ea;
        background: #edf6ff;
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 16px;
      }

      .product-grid {
        display: grid;
        gap: 14px;
      }

      .product-box {
        border: 1px solid #dae4ee;
        border-radius: 12px;
        background: #fff;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <h1>FitVision Widget - Local Integration Test</h1>
      <p class="note">
        To test against real backend, replace MOCK_MODE=true with real API key and product ID.
      </p>

      <div class="product-grid">
        <section class="product-box">
          <h2>Product A</h2>
          <div
            data-fitvision-product-id="test-product-123"
            data-fitvision-key="test-api-key"
            data-fitvision-locale="en"
          ></div>
        </section>

        <section class="product-box">
          <h2>Product B (No Size Chart)</h2>
          <div
            data-fitvision-product-id="no-chart-product"
            data-fitvision-key="test-api-key"
            data-fitvision-locale="pt"
          ></div>
        </section>

        <section class="product-box">
          <h2>Product C (Error Scenario)</h2>
          <div
            data-fitvision-product-id="error-product"
            data-fitvision-key="test-api-key"
            data-fitvision-locale="en"
          ></div>
        </section>
      </div>
    </div>

    <script>
      const MOCK_MODE = true;

      if (MOCK_MODE) {
        const originalFetch = globalThis.fetch.bind(globalThis);
        globalThis.fetch = async (input, init = {}) => {
          const url = typeof input === 'string' ? input : input.url;
          const method = (init.method || 'GET').toUpperCase();

          if (url.includes('/api/widget/v1/size-recommendation') && method === 'POST') {
            const body = init.body ? JSON.parse(init.body) : {};
            if (body.externalProductId === 'error-product') {
              return new Response(
                JSON.stringify({
                  success: false,
                  error: {
                    code: 'MOCK_UPSTREAM_FAILURE',
                    message: 'Mock upstream service unavailable.'
                  }
                }),
                {
                  status: 503,
                  headers: { 'Content-Type': 'application/json' }
                }
              );
            }

            const hasChart = body.externalProductId !== 'no-chart-product';

            const responseData = hasChart
              ? {
                  success: true,
                  data: {
                    recommendedSize: body.heightCm >= 180 ? 'L' : 'M',
                    confidenceScore: 0.89,
                    quality: 'EXACT',
                    productName: body.externalProductId || 'Classic Tee',
                    hasSizeChart: true,
                    confidenceLabel: 'High',
                    message: 'Based on your measurements, we recommend size M.'
                  }
                }
              : {
                  success: true,
                  data: {
                    recommendedSize: null,
                    confidenceScore: 0,
                    quality: 'NO_MATCH',
                    productName: body.externalProductId || 'Unknown Product',
                    hasSizeChart: false,
                    confidenceLabel: 'Low',
                    message: "We don't have size data for this product yet."
                  }
                };

            return new Response(JSON.stringify(responseData), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          }

          return originalFetch(input, init);
        };
      }
    </script>
    <script src="./dist/fitvision-widget.min.js"></script>
  </body>
</html>
