name: Widget CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'widget/**'
      - '.github/workflows/widget.yml'
  pull_request:
    branches: [main]
    paths:
      - 'widget/**'
      - '.github/workflows/widget.yml'
  workflow_dispatch:

concurrency:
  group: widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: widget

      - name: Build
        run: npm run build
        working-directory: widget

      - name: Read widget version
        id: version
        working-directory: widget
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Upload latest widget to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            r2 object put fitvision-widget/widget/fitvision-widget.min.js
            --file=widget/dist/fitvision-widget.min.js
            --content-type application/javascript
            --cache-control "public, max-age=300"

      - name: Upload versioned widget to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            r2 object put fitvision-widget/widget/fitvision-widget.${{ steps.version.outputs.version }}.min.js
            --file=widget/dist/fitvision-widget.${{ steps.version.outputs.version }}.min.js
            --content-type application/javascript
            --cache-control "public, max-age=31536000, immutable"
