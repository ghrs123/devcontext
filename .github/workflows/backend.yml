name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'Dockerfile.dev'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fitvision_test
          POSTGRES_USER: fitvision
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitvision -d fitvision_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B verify
        env:
          # Integration tests use Testcontainers; this URL is unused when ITs run.
          # Kept for spec parity and any future tests that read SPRING_DATASOURCE_URL.
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fitvision_test
          SPRING_PROFILES_ACTIVE: test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package (skip tests — already verified)
        run: mvn -B package -DskipTests

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@v0.1.2-beta
        with:
          service: fitvision-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Wait for deployment
        run: sleep 30

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh \
            https://api.fitvision.io \
            https://app.fitvision.io \
            https://cdn.fitvision.io/widget/fitvision-widget.min.js
